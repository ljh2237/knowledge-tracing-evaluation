[project]
name = "knowledge-tracing-test"
version = "1.0.0"
description = "CSV inference test harness for the learning path project"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3.1", "numpy>=1.26,<3"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
